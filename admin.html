<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills Tracker - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 12px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-value.paid {
            color: var(--secondary-color);
        }

        .stat-value.pending {
            color: var(--warning-color);
        }

        .stat-value.overdue {
            color: var(--danger-color);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-color);
        }

        .search-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .bills-table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:hover {
            background: var(--bg-color);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-paid {
            background: #d1fae5;
            color: #065f46;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-edit:hover {
            background: #bfdbfe;
        }

        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-filter {
                flex-direction: column;
            }

            th,
            td {
                padding: 10px;
                font-size: 12px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .stat-value {
                font-size: 24px;
            }

            table {
                font-size: 11px;
            }

            th,
            td {
                padding: 8px;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .priority-high {
            color: var(--danger-color);
            font-weight: 600;
        }

        .priority-medium {
            color: var(--warning-color);
            font-weight: 600;
        }

        .priority-low {
            color: var(--secondary-color);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>💰 Bills Tracker - Admin Dashboard</h1>
                <button class="btn btn-primary" onclick="openModal()">
                    <span>+</span> Add New Bill
                </button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Bills</div>
                <div class="stat-value" id="totalBills">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Paid</div>
                <div class="stat-value paid" id="paidBills">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value pending" id="pendingBills">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Overdue</div>
                <div class="stat-value overdue" id="overdueBills">0</div>
            </div>
        </div>

        <div class="actions-bar">
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Search bills..." oninput="filterBills()">
                <select id="statusFilter" onchange="filterBills()">
                    <option value="">All Status</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="overdue">Overdue</option>
                </select>
                <select id="priorityFilter" onchange="filterBills()">
                    <option value="">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="exportData()">📥 Export CSV</button>
        </div>

        <div class="bills-table-container">
            <table id="billsTable">
                <thead>
                    <tr>
                        <th>Bill Name</th>
                        <th>Amount</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="billsTableBody">
                    <tr>
                        <td colspan="7" class="loading">Loading bills...</td>
                    </tr>
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <h3>No bills found</h3>
                <p>Add your first bill to get started!</p>
            </div>
        </div>
    </div>

    <div id="billModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Bill</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="billForm" onsubmit="saveBill(event)">
                <input type="hidden" id="billId">
                <div class="form-group">
                    <label for="billName">Bill Name *</label>
                    <input type="text" id="billName" required placeholder="e.g., Electricity Bill">
                </div>
                <div class="form-group">
                    <label for="billAmount">Amount (₱) *</label>
                    <input type="number" id="billAmount" required min="0" step="0.01" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="billDueDate">Due Date *</label>
                    <input type="date" id="billDueDate" required>
                </div>
                <div class="form-group">
                    <label for="billStatus">Status</label>
                    <select id="billStatus">
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="overdue">Overdue</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="billPriority">Priority</label>
                    <select id="billPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="billCategory">Category</label>
                    <select id="billCategory">
                        <option value="utilities">Utilities</option>
                        <option value="rent">Rent/Mortgage</option>
                        <option value="insurance">Insurance</option>
                        <option value="subscription">Subscription</option>
                        <option value="loan">Loan</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="billNotes">Notes</label>
                    <input type="text" id="billNotes" placeholder="Additional notes...">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Bill</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            set,
            push,
            onValue,
            remove,
            update,
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuhEMi_ZNqOq70tlTmnHA6bNVKoq_HNrA",
            authDomain: "ticketingsystem-16fa6.firebaseapp.com",
            databaseURL: "https://ticketingsystem-16fa6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ticketingsystem-16fa6",
            storageBucket: "ticketingsystem-16fa6.firebasestorage.app",
            messagingSenderId: "127146989035",
            appId: "1:127146989035:web:cb5e863405edd3bcc4f5ae",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const billsRef = ref(db, 'bills');

        let bills = [];
        let editingId = null;

        // Listen for real-time updates
        onValue(billsRef, (snapshot) => {
            const data = snapshot.val();
            bills = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    bills.push({ id: key, ...data[key] });
                });
            }
            renderBills();
            updateStats();
        });

        window.renderBills = function (filteredBills = null) {
            const tbody = document.getElementById('billsTableBody');
            const emptyState = document.getElementById('emptyState');
            let dataToRender = filteredBills || bills;

            // Sort by due date descending (most recent on top)
            dataToRender.sort((a, b) => new Date(b.dueDate) - new Date(a.dueDate));

            if (dataToRender.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = dataToRender.map(bill => `
                <tr>
                    <td><strong>${escapeHtml(bill.name)}</strong></td>
                    <td>₱${formatCurrency(bill.amount)}</td>
                    <td>${formatDate(bill.dueDate)}</td>
                    <td><span class="status-badge status-${bill.status}">${bill.status}</span></td>
                    <td><span class="priority-${bill.priority}">${bill.priority}</span></td>
                    <td>${bill.category}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-icon btn-edit" onclick="editBill('${bill.id}')">Edit</button>
                            <button class="btn-icon btn-delete" onclick="deleteBill('${bill.id}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        };

        window.updateStats = function () {
            const total = bills.length;
            const paid = bills.filter(b => b.status === 'paid').length;
            const pending = bills.filter(b => b.status === 'pending').length;
            const overdue = bills.filter(b => b.status === 'overdue').length;

            document.getElementById('totalBills').textContent = total;
            document.getElementById('paidBills').textContent = paid;
            document.getElementById('pendingBills').textContent = pending;
            document.getElementById('overdueBills').textContent = overdue;
        };

        window.openModal = function (billId = null) {
            const modal = document.getElementById('billModal');
            const form = document.getElementById('billForm');
            const title = document.getElementById('modalTitle');

            editingId = billId;

            if (billId) {
                const bill = bills.find(b => b.id === billId);
                title.textContent = 'Edit Bill';
                document.getElementById('billId').value = bill.id;
                document.getElementById('billName').value = bill.name;
                document.getElementById('billAmount').value = bill.amount;
                document.getElementById('billDueDate').value = bill.dueDate;
                document.getElementById('billStatus').value = bill.status;
                document.getElementById('billPriority').value = bill.priority;
                document.getElementById('billCategory').value = bill.category;
                document.getElementById('billNotes').value = bill.notes || '';
            } else {
                title.textContent = 'Add New Bill';
                form.reset();
                document.getElementById('billId').value = '';
                document.getElementById('billDueDate').value = new Date().toISOString().split('T')[0];
            }

            modal.classList.add('active');
        };

        window.closeModal = function () {
            const modal = document.getElementById('billModal');
            modal.classList.remove('active');
            editingId = null;
        };

        window.saveBill = async function (event) {
            event.preventDefault();

            const billData = {
                name: document.getElementById('billName').value,
                amount: parseFloat(document.getElementById('billAmount').value),
                dueDate: document.getElementById('billDueDate').value,
                status: document.getElementById('billStatus').value,
                priority: document.getElementById('billPriority').value,
                category: document.getElementById('billCategory').value,
                notes: document.getElementById('billNotes').value,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            try {
                if (editingId) {
                    await update(ref(db, 'bills/' + editingId), billData);
                } else {
                    await push(billsRef, billData);
                }
                closeModal();
            } catch (error) {
                console.error('Error saving bill:', error);
                alert('Error saving bill. Please try again.');
            }
        };

        window.editBill = function (id) {
            openModal(id);
        };

        window.deleteBill = async function (id) {
            if (confirm('Are you sure you want to delete this bill?')) {
                try {
                    await remove(ref(db, 'bills/' + id));
                } catch (error) {
                    console.error('Error deleting bill:', error);
                    alert('Error deleting bill. Please try again.');
                }
            }
        };

        window.filterBills = function () {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;

            let filtered = bills.filter(bill => {
                const matchesSearch = bill.name.toLowerCase().includes(searchTerm) ||
                    bill.category.toLowerCase().includes(searchTerm);
                const matchesStatus = !statusFilter || bill.status === statusFilter;
                const matchesPriority = !priorityFilter || bill.priority === priorityFilter;

                return matchesSearch && matchesStatus && matchesPriority;
            });

            renderBills(filtered);
        };

        window.exportData = function () {
            if (bills.length === 0) {
                alert('No bills to export!');
                return;
            }

            const headers = ['Name', 'Amount', 'Due Date', 'Status', 'Priority', 'Category', 'Notes'];
            const csvContent = [
                headers.join(','),
                ...bills.map(bill => [
                    `"${bill.name}"`,
                    bill.amount,
                    bill.dueDate,
                    bill.status,
                    bill.priority,
                    bill.category,
                    `"${bill.notes || ''}"`
                ].join(','))
            ].join('\\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bills_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        };

        function formatCurrency(amount) {
            return parseFloat(amount).toLocaleString('en-PH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-PH', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('billModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>

</html>
