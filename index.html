<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bills - Customer Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 16px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .welcome-banner {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .welcome-text h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform 0.2s;
        }

        .summary-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .summary-label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
        }

        .summary-value.amount {
            color: var(--primary-color);
        }

        .section-title {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px 12px 0 0;
            margin-top: 25px;
            box-shadow: var(--shadow);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .bills-list {
            background: var(--card-bg);
            border-radius: 0 0 12px 12px;
            box-shadow: var(--shadow);
        }

        .bill-item {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            padding-left: 24px;
            cursor: pointer;
        }

        .bill-item:last-child {
            border-bottom: none;
        }

        .bill-item:hover {
            background: #f8fafc;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 15px;
        }

        .bill-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .bill-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .bill-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .bill-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pay {
            background: var(--success-color);
            color: white;
        }

        .btn-pay:hover {
            background: #059669;
        }

        .btn-details {
            background: #f1f5f9;
            color: var(--text-primary);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-paid {
            background: #d1fae5;
            color: #065f46;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        .priority-indicator {
            width: 4px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        .priority-high {
            background: var(--danger-color);
        }

        .priority-medium {
            background: var(--warning-color);
        }

        .priority-low {
            background: var(--success-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .payment-success {
            background: #d1fae5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .payment-success.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .bill-header {
                flex-direction: column;
            }

            .bill-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .summary-cards {
                grid-template-columns: 1fr;
            }

            .summary-value {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>My Bills Portal</h1>
            <p class="subtitle">View and manage your bills easily</p>
        </header>

        <div class="welcome-banner">
            <div class="welcome-text">
                <h2>Welcome back!</h2>
                <p style="color: var(--text-secondary);">Here is a summary of your current bills</p>
            </div>
        </div>

        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-label">Total Due</div>
                <div class="summary-value amount" id="totalDue">₱0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Paid This Month</div>
                <div class="summary-value" id="paidCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Pending</div>
                <div class="summary-value" id="pendingCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Overdue</div>
                <div class="summary-value" id="overdueCount">0</div>
            </div>
        </div>

        <div class="section-title">
            <span>Your Bills</span>
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterBills('all')">All</button>
                <button class="tab-btn" onclick="filterBills('pending')">Pending</button>
                <button class="tab-btn" onclick="filterBills('paid')">Paid</button>
                <button class="tab-btn" onclick="filterBills('overdue')">Overdue</button>
            </div>
        </div>

        <div class="bills-list" id="billsList">
            <div class="loading">Loading bills...</div>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalBillName" style="margin-bottom: 5px;">Bill Details</h2>
            <p id="modalBillCategory" style="color: var(--text-secondary); margin-bottom: 20px;">Category</p>
            <div id="modalDetails"></div>
            <div class="payment-success" id="paymentSuccess">Payment processed successfully!</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            onValue,
            update,
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuhEMi_ZNqOq70tlTmnHA6bNVKoq_HNrA",
            authDomain: "ticketingsystem-16fa6.firebaseapp.com",
            databaseURL: "https://ticketingsystem-16fa6-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ticketingsystem-16fa6",
            storageBucket: "ticketingsystem-16fa6.firebasestorage.app",
            messagingSenderId: "127146989035",
            appId: "1:127146989035:web:cb5e863405edd3bcc4f5ae",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const billsRef = ref(db, 'bills');

        let bills = [];
        let currentFilter = 'all';

        // Listen for real-time updates
        onValue(billsRef, (snapshot) => {
            const data = snapshot.val();
            bills = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    bills.push({ id: key, ...data[key] });
                });
            }
            renderBills();
            updateSummary();
        });

        window.renderBills = function () {
            const billsList = document.getElementById('billsList');
            let filteredBills = currentFilter === 'all' ? bills : bills.filter(b => b.status === currentFilter);

            // Sort by due date descending (most recent on top)
            filteredBills.sort((a, b) => new Date(b.dueDate) - new Date(a.dueDate));

            if (filteredBills.length === 0) {
                billsList.innerHTML = '<div class="loading"><h3>No bills found</h3></div>';
                return;
            }

            billsList.innerHTML = filteredBills.map(bill => {
                let actionsHtml = bill.status !== 'paid' ?
                    '<div class="bill-actions"><button class="btn btn-pay" onclick="event.stopPropagation(); payBill(\'' + bill.id + '\')">Pay Now</button><button class="btn btn-details" onclick="event.stopPropagation(); showDetails(\'' + bill.id + '\')">View Details</button></div>' : '';

                return '<div class="bill-item" onclick="showDetails(\'' + bill.id + '\')">' +
                    '<div class="priority-indicator priority-' + bill.priority + '"></div>' +
                    '<div class="bill-header">' +
                    '<div><div class="bill-name">' + escapeHtml(bill.name) + '</div>' +
                    '<div class="bill-meta">' + formatDate(bill.dueDate) + ' | ' + bill.category + ' | <span class="status-badge status-' + bill.status + '">' + bill.status + '</span></div></div>' +
                    '<div class="bill-amount">₱' + parseFloat(bill.amount).toFixed(2) + '</div></div>' +
                    actionsHtml + '</div>';
            }).join('');
        };

        window.updateSummary = function () {
            const unpaid = bills.filter(b => b.status !== 'paid');
            const totalDue = unpaid.reduce((sum, b) => sum + parseFloat(b.amount), 0);
            const now = new Date();
            const paidThisMonth = bills.filter(b => b.status === 'paid' && new Date(b.updatedAt || b.createdAt).getMonth() === now.getMonth()).length;

            document.getElementById('totalDue').textContent = '₱' + formatCurrency(totalDue);
            document.getElementById('paidCount').textContent = paidThisMonth;
            document.getElementById('pendingCount').textContent = bills.filter(b => b.status === 'pending').length;
            document.getElementById('overdueCount').textContent = bills.filter(b => b.status === 'overdue').length;
        };

        window.filterBills = function (filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderBills();
        };

        window.showDetails = function (billId) {
            const bill = bills.find(b => b.id === billId);
            if (!bill) return;

            document.getElementById('modalBillName').textContent = bill.name;
            document.getElementById('modalBillCategory').textContent = bill.category;
            document.getElementById('paymentSuccess').classList.remove('show');

            document.getElementById('modalDetails').innerHTML =
                '<div class="detail-row"><div>Amount</div><div style="font-size: 20px; color: var(--primary-color); font-weight: 700;">₱' + formatCurrency(bill.amount) + '</div></div>' +
                '<div class="detail-row"><div>Due Date</div><div>' + formatDate(bill.dueDate) + '</div></div>' +
                '<div class="detail-row"><div>Status</div><div><span class="status-badge status-' + bill.status + '">' + bill.status + '</span></div></div>' +
                '<div class="detail-row"><div>Priority</div><div>' + bill.priority.toUpperCase() + '</div></div>' +
                (bill.notes ? '<div class="detail-row"><div>Notes</div><div>' + escapeHtml(bill.notes) + '</div></div>' : '');

            document.getElementById('detailsModal').classList.add('active');
        };

        window.payBill = async function (billId) {
            const bill = bills.find(b => b.id === billId);
            if (!bill) return;

            if (confirm('Confirm payment of ₱' + formatCurrency(bill.amount) + '?')) {
                try {
                    await update(ref(db, 'bills/' + billId), {
                        status: 'paid',
                        updatedAt: new Date().toISOString()
                    });
                    document.getElementById('paymentSuccess').classList.add('show');
                    setTimeout(() => { closeModal(); }, 1500);
                } catch (error) {
                    console.error('Error updating bill:', error);
                    alert('Error processing payment. Please try again.');
                }
            }
        };

        window.closeModal = function () {
            document.getElementById('detailsModal').classList.remove('active');
        };

        function formatCurrency(amount) {
            return parseFloat(amount).toLocaleString('en-PH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('detailsModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
